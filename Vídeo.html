<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DreamForge Studio - Video Editor</title>
    <style>
        :root {
            --bg-dark: #121214;
            --panel-bg: #1a1a1e;
            --panel-border: #2c2c35;
            --accent: #007acc;
            --accent-hover: #0098ff;
            --text: #e1e1e6;
            --text-dim: #a0a0a5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Barra de herramientas superior */
        header {
            background-color: var(--panel-bg);
            border-bottom: 2px solid var(--panel-border);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        h1 {
            font-size: 1.2rem;
            letter-spacing: 1px;
            color: var(--text);
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .btn {
            background: linear-gradient(180deg, #2d2d35 0%, #1e1e24 100%);
            border: 1px solid var(--panel-border);
            color: var(--text);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.1);
        }

        .btn:hover {
            border-color: var(--accent);
            box-shadow: 0 0 8px rgba(0, 122, 204, 0.4);
        }

        .btn-primary {
            background: linear-gradient(180deg, var(--accent-hover) 0%, var(--accent) 100%);
            border: 1px solid #005999;
        }

        /* Contenedor Principal */
        .workspace {
            flex: 1;
            display: grid;
            grid-template-columns: 300px 1fr;
            grid-template-rows: 1fr 250px;
            height: calc(100vh - 54px);
        }

        /* Panel Lateral (Archivos) */
        .panel-assets {
            background-color: var(--panel-bg);
            border-right: 2px solid var(--panel-border);
            grid-row: 1;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .upload-box {
            border: 2px dashed var(--panel-border);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            color: var(--text-dim);
            cursor: pointer;
            transition: border 0.2s;
        }

        .upload-box:hover {
            border-color: var(--accent);
            color: var(--text);
        }

        .asset-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .asset-item {
            background-color: #222226;
            border: 1px solid var(--panel-border);
            padding: 10px;
            border-radius: 6px;
            cursor: grab;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
        }

        /* Panel de Previsualización (Monitor) */
        .panel-preview {
            grid-column: 2;
            grid-row: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #0b0b0d;
            padding: 20px;
            position: relative;
        }

        .monitor-container {
            position: relative;
            max-width: 100%;
            max-height: 75%;
            aspect-ratio: 16 / 9;
            background-color: #000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            border-radius: 4px;
            overflow: hidden;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .player-controls {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        /* Línea de Tiempo (Timeline) */
        .panel-timeline {
            grid-column: 1 / span 2;
            grid-row: 2;
            background-color: var(--panel-bg);
            border-top: 2px solid var(--panel-border);
            display: flex;
            flex-direction: column;
        }

        .timeline-header {
            background-color: #151518;
            padding: 6px 20px;
            border-bottom: 1px solid var(--panel-border);
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--text-dim);
        }

        .timeline-body {
            flex: 1;
            position: relative;
            overflow-x: auto;
            overflow-y: hidden;
            padding: 20px;
            background-color: #131316;
        }

        .track {
            height: 80px;
            background-color: #1a1a1e;
            border: 2px dashed #2c2c35;
            border-radius: 8px;
            position: relative;
            width: 100%;
            min-width: 800px;
        }

        .track.drag-over {
            border-color: var(--accent);
            background-color: rgba(0, 122, 204, 0.05);
        }

        .clip {
            position: absolute;
            top: 5px;
            height: 66px;
            background: linear-gradient(135deg, #005999 0%, #007acc 100%);
            border: 1px solid #0098ff;
            color: white;
            border-radius: 6px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            cursor: pointer;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .clip span {
            font-size: 0.8rem;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Playhead (Indicador de tiempo actual) */
        .playhead {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 2px;
            background-color: #ff3333;
            left: 20px;
            pointer-events: none;
            z-index: 10;
        }

        .playhead::before {
            content: '';
            position: absolute;
            top: 0;
            left: -5px;
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-top: 8px solid #ff3333;
        }

        #file-input {
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>DREAMFORGE STUDIO</h1>
        <button class="btn btn-primary" id="export-btn">Exportar Proyecto</button>
    </header>

    <div class="workspace">
        <!-- Panel de Archivos -->
        <div class="panel-assets">
            <div class="upload-box" onclick="document.getElementById('file-input').click()">
                <p>+ Importar Video</p>
                <span style="font-size: 0.75rem; color: var(--text-dim);">Soporta MP4, WebM</span>
            </div>
            <input type="file" id="file-input" accept="video/*">
            <div class="asset-list" id="asset-list">
                <!-- Los archivos importados aparecerán aquí -->
            </div>
        </div>

        <!-- Monitor de Previsualización -->
        <div class="panel-preview">
            <div class="monitor-container">
                <canvas id="monitor"></canvas>
            </div>
            <div class="player-controls">
                <button class="btn" id="btn-play">Reproducir</button>
                <div id="time-display" style="font-family: monospace; font-size: 0.9rem;">00:00:00</div>
            </div>
        </div>

        <!-- Línea de Tiempo -->
        <div class="panel-timeline">
            <div class="timeline-header">
                <div>Línea de Tiempo Principal</div>
                <div id="timeline-duration" style="font-family: monospace;">Duración: 0.0s</div>
            </div>
            <div class="timeline-body" id="timeline-body">
                <div class="playhead" id="playhead"></div>
                <div class="track" id="video-track">
                    <!-- Aquí se arrastran los clips -->
                </div>
            </div>
        </div>
    </div>

    <!-- Elemento de video oculto que usaremos para decodificar los frames en el canvas -->
    <video id="hidden-video" style="display:none;"></video>

    <script>
        // Variables de estado
        let activeVideoFile = null;
        let isPlaying = false;
        let videoDuration = 0;
        let animationFrameId = null;

        // Elementos del DOM
        const fileInput = document.getElementById('file-input');
        const assetList = document.getElementById('asset-list');
        const hiddenVideo = document.getElementById('hidden-video');
        const canvas = document.getElementById('monitor');
        const ctx = canvas.getContext('2d');
        const btnPlay = document.getElementById('btn-play');
        const timeDisplay = document.getElementById('time-display');
        const videoTrack = document.getElementById('video-track');
        const playhead = document.getElementById('playhead');
        const timelineDuration = document.getElementById('timeline-duration');
        const exportBtn = document.getElementById('export-btn');

        // Configurar dimensiones iniciales del Canvas (1080p interno escalado por CSS)
        canvas.width = 1920;
        canvas.height = 1080;
        
        // Dibujar pantalla en negro inicial
        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 1. Importar Archivos
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            activeVideoFile = file;
            const objectURL = URL.createObjectURL(file);
            hiddenVideo.src = objectURL;

            // Limpiar lista anterior y agregar elemento visual
            assetList.innerHTML = '';
            const item = document.createElement('div');
            item.className = 'asset-item';
            item.draggable = true;
            item.innerHTML = `🎥 <span>${file.name}</span>`;
            
            // Configurar Drag & Drop
            item.addEventListener('dragstart', (ev) => {
                ev.dataTransfer.setData('text/plain', objectURL);
            });
            
            assetList.appendChild(item);
        });

        // 2. Controladores de la Línea de Tiempo (Drag & Drop de clips)
        videoTrack.addEventListener('dragover', (e) => {
            e.preventDefault();
            videoTrack.classList.add('drag-over');
        });

        videoTrack.addEventListener('dragleave', () => {
            videoTrack.classList.remove('drag-over');
        });

        videoTrack.addEventListener('drop', (e) => {
            e.preventDefault();
            videoTrack.classList.remove('drag-over');
            const objectURL = e.dataTransfer.getData('text/plain');

            if (objectURL) {
                // Esperar a que el video cargue los metadatos para conocer su duración real
                hiddenVideo.onloadedmetadata = () => {
                    videoDuration = hiddenVideo.duration;
                    timelineDuration.textContent = `Duración: ${videoDuration.toFixed(1)}s`;
                    
                    // Crear el bloque visual del clip en el timeline
                    videoTrack.innerHTML = ''; // Reemplaza por simplicidad en esta versión de clip único
                    const clip = document.createElement('div');
                    clip.className = 'clip';
                    
                    // Escalar el ancho del clip: 1 segundo = 40 píxeles de ancho
                    const clipWidth = videoDuration * 40;
                    clip.style.width = `${clipWidth}px`;
                    clip.style.left = '0px';
                    clip.innerHTML = `<span>${activeVideoFile.name}</span>`;
                    
                    videoTrack.appendChild(clip);
                    updatePlayhead(0);
                };
            }
        });

        // 3. Motor de renderizado (Canvas Sync con Video Oculto)
        function renderLoop() {
            if (!isPlaying) return;

            // Dibujar el fotograma actual del video en el lienzo
            ctx.drawImage(hiddenVideo, 0, 0, canvas.width, canvas.height);
            
            // Aplicar un sutil filtro de color en tiempo real (puedes modificar esto)
            // Ejemplo: un ligero boost de contraste/saturación digital
            ctx.fillStyle = 'rgba(0, 122, 204, 0.03)';
            ctx.globalCompositeOperation = 'color-burn';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.globalCompositeOperation = 'source-over';

            // Actualizar tiempos e interfaz
            updateTimeDisplay(hiddenVideo.currentTime);
            
            // Mover la aguja (playhead): 20px de margen inicial + 40px por segundo
            const currentLeft = 20 + (hiddenVideo.currentTime * 40);
            playhead.style.left = `${currentLeft}px`;

            if (hiddenVideo.ended) {
                stopPlayback();
            } else {
                animationFrameId = requestAnimationFrame(renderLoop);
            }
        }

        function updatePlayhead(time) {
            const currentLeft = 20 + (time * 40);
            playhead.style.left = `${currentLeft}px`;
            updateTimeDisplay(time);
        }

        function updateTimeDisplay(seconds) {
            const date = new Date(null);
            date.setSeconds(seconds);
            const milliseconds = Math.floor((seconds % 1) * 100);
            timeDisplay.textContent = date.toISOString().substr(11, 8) + ':' + milliseconds.toString().padStart(2, '0');
        }

        // 4. Controles de Reproducción
        function togglePlayback() {
            if (!activeVideoFile) return alert('¡Primero arrastra el archivo de video a la línea de tiempo!');

            if (isPlaying) {
                stopPlayback();
            } else {
                isPlaying = true;
                btnPlay.textContent = 'Pausar';
                hiddenVideo.play();
                renderLoop();
            }
        }

        function stopPlayback() {
            isPlaying = false;
            btnPlay.textContent = 'Reproducir';
            hiddenVideo.pause();
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
        }

        btnPlay.addEventListener('click', togglePlayback);

        // 5. Botón de Exportar simulado
        exportBtn.addEventListener('click', () => {
            if (!activeVideoFile) return alert('No hay clips en el timeline para procesar.');
            alert('¡Procesando línea de tiempo!\nEn un entorno de producción completo, aquí usaríamos MediaRecorder de JavaScript o FFmpeg.wasm para compilar el Canvas y guardarlo en un archivo MP4 real.');
        });
    </script>
</body>
</html>

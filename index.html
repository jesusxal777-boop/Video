<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DreamForge Studio PRO</title>
    <style>
        :root {
            --bg-dark: #0f0f11;
            --panel-bg: #16161a;
            --panel-border: #26262e;
            --accent: #007acc;
            --accent-hover: #0098ff;
            --text: #e1e1e6;
            --text-dim: #8f8f9d;
            --timeline-bg: #111113;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; user-select: none; }
        body { background-color: var(--bg-dark); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        header {
            background-color: var(--panel-bg);
            border-bottom: 2px solid var(--panel-border);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 { font-size: 1.1rem; letter-spacing: 1px; color: var(--text); }

        .btn {
            background: linear-gradient(180deg, #2d2d35 0%, #1e1e24 100%);
            border: 1px solid var(--panel-border);
            color: var(--text);
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .btn:hover { border-color: var(--accent); }
        .btn-active { background: var(--accent); border-color: var(--accent-hover); }

        /* Workspace Grid */
        .workspace {
            flex: 1;
            display: grid;
            grid-template-columns: 320px 1fr 300px;
            grid-template-rows: 1fr 280px;
            height: calc(100vh - 50px);
        }

        /* Panel Izquierdo: Assets */
        .panel-left {
            background-color: var(--panel-bg);
            border-right: 2px solid var(--panel-border);
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            grid-row: 1;
        }

        .upload-zone {
            border: 2px dashed var(--panel-border);
            border-radius: 6px;
            padding: 15px;
            text-align: center;
            color: var(--text-dim);
            cursor: pointer;
            font-size: 0.9rem;
        }
        .upload-zone:hover { border-color: var(--accent); color: var(--text); }

        .asset-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .asset-item {
            background-color: #1e1e24;
            border: 1px solid var(--panel-border);
            padding: 8px 12px;
            border-radius: 4px;
            cursor: grab;
            font-size: 0.8rem;
            display: flex;
            justify-content: space-between;
        }

        /* Panel Central: Monitor */
        .panel-center {
            grid-column: 2;
            background-color: #09090b;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        .monitor-wrapper {
            width: 100%;
            max-width: 720px;
            aspect-ratio: 16 / 9;
            background-color: #000;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            position: relative;
        }
        canvas { width: 100%; height: 100%; display: block; }

        .controls { margin-top: 12px; display: flex; gap: 15px; align-items: center; }

        /* Panel Derecho: Inspector de Propiedades */
        .panel-right {
            background-color: var(--panel-bg);
            border-left: 2px solid var(--panel-border);
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            font-size: 0.85rem;
        }
        .inspector-group {
            border-bottom: 1px solid var(--panel-border);
            padding-bottom: 12px;
        }
        .inspector-group h3 { font-size: 0.9rem; margin-bottom: 8px; color: var(--text-dim); }
        .control-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .control-row input[type="range"] { width: 120px; }
        .control-row input[type="number"] { width: 60px; background: #222; border: 1px solid #444; color: #fff; padding: 2px; }

        /* Panel Inferior: Timeline Avanzado */
        .panel-timeline {
            grid-column: 1 / span 3;
            grid-row: 2;
            background-color: var(--panel-bg);
            border-top: 2px solid var(--panel-border);
            display: flex;
            flex-direction: column;
        }

        .timeline-toolbar {
            background-color: #121215;
            padding: 6px 20px;
            border-bottom: 1px solid var(--panel-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
        }

        .timeline-container {
            flex: 1;
            overflow-x: auto;
            overflow-y: auto;
            position: relative;
            background-color: var(--timeline-bg);
            padding: 10px 0;
        }

        .tracks-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-left: 100px; /* Espacio para etiquetas de capa */
            min-width: 2000px;
        }

        .track-label {
            position: absolute;
            left: 0;
            width: 90px;
            height: 50px;
            background-color: #1e1e24;
            border: 1px solid var(--panel-border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: bold;
            z-index: 5;
        }

        .timeline-track {
            height: 50px;
            background-color: #151519;
            border: 1px solid #222;
            position: relative;
            width: 100%;
        }

        .timeline-track.drag-over { background-color: rgba(0, 122, 204, 0.1); }

        .timeline-clip {
            position: absolute;
            top: 2px;
            height: 44px;
            background: linear-gradient(135deg, #2b5c8f 0%, #1a3a60 100%);
            border: 1px solid #3a7bc0;
            border-radius: 4px;
            color: white;
            padding: 4px 8px;
            font-size: 0.7rem;
            cursor: pointer;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .timeline-clip.selected { border-color: #ffcc00; box-shadow: 0 0 8px rgba(255, 204, 0, 0.5); }
        
        /* Handles de recorte (Trim) */
        .trim-handle {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 6px;
            background-color: rgba(255,255,255,0.3);
            cursor: ew-resize;
        }
        .trim-left { left: 0; }
        .trim-right { right: 0; }

        /* Aguja global (Playhead) */
        .playhead {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 2px;
            background-color: #ff3333;
            left: 100px; /* Sincronizado con el padding lateral */
            pointer-events: none;
            z-index: 10;
        }
        .playhead::before {
            content: ''; position: absolute; top: 0; left: -5px;
            border-left: 6px solid transparent; border-right: 6px solid transparent;
            border-top: 8px solid #ff3333;
        }
    </style>
</head>
<body>

    <header>
        <h1>DREAMFORGE ENGINE - MULTILAYER NLE</h1>
        <button class="btn btn-active" onclick="exportTimeline()">Renderizar Salida</button>
    </header>

    <div class="workspace">
        <!-- Panel Izquierdo: Assets -->
        <div class="panel-left">
            <div class="upload-zone" onclick="document.getElementById('file-loader').click()">
                <p>+ Cargar Archivos</p>
                <span style="font-size: 0.7rem; color: var(--text-dim)">Video, Imagen o Audio</span>
            </div>
            <input type="file" id="file-loader" accept="video/*,image/*,audio/*" multiple style="display:none">
            <div class="asset-list" id="asset-list"></div>
        </div>

        <!-- Panel Central: Monitor -->
        <div class="panel-center">
            <div class="monitor-wrapper">
                <canvas id="main-monitor"></canvas>
            </div>
            <div class="controls">
                <button class="btn" id="btn-play" onclick="togglePlayback()">Reproducir</button>
                <div id="timecode" style="font-family: monospace;">00:00.00</div>
            </div>
        </div>

        <!-- Panel Derecho: Inspector de Propiedades -->
        <div class="panel-right" id="inspector">
            <p style="color: var(--text-dim); text-align: center; margin-top: 20px;">Selecciona un clip para editar sus propiedades</p>
        </div>
    </div>

    <!-- Panel Inferior: Timeline -->
    <div class="panel-timeline">
        <div class="timeline-toolbar">
            <div>Líneas de Composición Multi-Capa</div>
            <div style="font-family: monospace;" id="total-duration">Tiempo Máx: 0.0s</div>
        </div>
        <div class="timeline-container" id="timeline-container" onclick="movePlayheadViaTimeline(event)">
            <div class="playhead" id="global-playhead"></div>
            
            <div class="tracks-wrapper">
                <!-- Capa 1: Video -->
                <div class="track-label" style="top: 0;">Capa Video</div>
                <div class="timeline-track" id="track-video" data-type="video" style="margin-top: 0;"></div>

                <!-- Capa 2: Gráficos / Imagen -->
                <div class="track-label" style="top: 56px;">Capa Imagen</div>
                <div class="timeline-track" id="track-image" data-type="image"></div>

                <!-- Capa 3: Audio -->
                <div class="track-label" style="top: 112px;">Capa Audio</div>
                <div class="timeline-track" id="track-audio" data-type="audio"></div>
            </div>
        </div>
    </div>

    <script>
        // --- BASE DE DATOS DE LA COMPOSICIÓN (STATE) ---
        let assets = {};
        let timelineClips = [];
        let selectedClip = null;
        let currentTime = 0; 
        let isPlaying = false;
        let animationFrameId = null;
        const PIXELS_PER_SECOND = 30; // Factor de escala para el timeline

        const canvas = document.getElementById('main-monitor');
        const ctx = canvas.getContext('2d');
        canvas.width = 1280;
        canvas.height = 720;

        // Limpieza de pantalla inicial
        clearMonitor();

        // --- SISTEMA DE CARGA DE ARCHIVOS ---
        document.getElementById('file-loader').addEventListener('change', function(e) {
            Array.from(e.target.files).forEach(file => {
                const id = 'asset-' + Date.now() + Math.random().toString(36).substr(2, 5);
                const url = URL.createObjectURL(file);
                let type = 'image';

                if (file.type.startsWith('video')) type = 'video';
                if (file.type.startsWith('audio')) type = 'audio';

                let element;
                if (type === 'video') {
                    element = document.createElement('video');
                    element.src = url;
                    element.muted = true; // Muteado para procesamiento manual en Canvas
                    element.load();
                } else if (type === 'audio') {
                    element = document.createElement('audio');
                    element.src = url;
                } else {
                    element = new Image();
                    element.src = url;
                }

                assets[id] = { id, name: file.name, type, element, url };

                // Renderizar en el panel de recursos
                const item = document.createElement('div');
                item.className = 'asset-item';
                item.draggable = true;
                item.innerHTML = `<span>${type === 'video' ? '🎥' : type === 'audio' ? '🎵' : '🖼️'} ${file.name}</span>`;
                item.addEventListener('dragstart', (ev) => {
                    ev.dataTransfer.setData('text/asset-id', id);
                });
                document.getElementById('asset-list').appendChild(item);
            });
        });

        // --- MANEJO DE DRAG & DROP EN EL TIMELINE ---
        document.querySelectorAll('.timeline-track').forEach(track => {
            track.addEventListener('dragover', e => e.preventDefault());
            track.addEventListener('drop', function(e) {
                e.preventDefault();
                const assetId = e.dataTransfer.getData('text/asset-id');
                const asset = assets[assetId];
                if (!asset) return;

                // Validar que caiga en su respectiva capa
                if (track.dataset.type !== asset.type) {
                    alert(`¡Error! El recurso tipo [${asset.type}] debe ir en su respectiva capa.`);
                    return;
                }

                // Calcular posición de inserción según los píxeles del cursor
                const rect = track.getBoundingClientRect();
                const clickX = e.clientX - rect.left;
                const startTimePosition = clickX / PIXELS_PER_SECOND;

                // Definir duración por defecto
                let duration = 5; 
                if (asset.type === 'video' || asset.type === 'audio') {
                    duration = asset.element.duration || 5;
                }

                const newClip = {
                    id: 'clip-' + Date.now(),
                    assetId: assetId,
                    type: asset.type,
                    name: asset.name,
                    start: startTimePosition,
                    duration: duration,
                    trimLeft: 0,
                    // Propiedades geométricas & Efectos por defecto
                    opacity: 1,
                    scale: 100,
                    posX: 0,
                    posY: 0,
                    filter: 'none',
                    volume: 1
                };

                timelineClips.push(newClip);
                renderTimelineUI();
                updateMonitor();
            });
        });

        // --- RENDERIZADO VISUAL DEL TIMELINE UI ---
        function renderTimelineUI() {
            // Limpiar tracks visuales
            document.querySelectorAll('.timeline-track').forEach(t => t.innerHTML = '');

            let maxTime = 0;

            timelineClips.forEach(clip => {
                const track = document.getElementById(`track-${clip.type}`);
                if (!track) return;

                const clipEl = document.createElement('div');
                clipEl.className = `timeline-clip ${selectedClip && selectedClip.id === clip.id ? 'selected' : ''}`;
                clipEl.style.left = `${clip.start * PIXELS_PER_SECOND}px`;
                clipEl.style.width = `${clip.duration * PIXELS_PER_SECOND}px`;
                clipEl.innerHTML = `<strong>${clip.name}</strong><span>Duración: ${clip.duration.toFixed(1)}s</span>`;

                // Agregar controladores de recorte (Trimming)
                const leftHandle = document.createElement('div');
                leftHandle.className = 'trim-handle trim-left';
                const rightHandle = document.createElement('div');
                rightHandle.className = 'trim-handle trim-right';

                clipEl.appendChild(leftHandle);
                clipEl.appendChild(rightHandle);

                // Eventos de selección
                clipEl.addEventListener('click', (e) => {
                    e.stopPropagation();
                    selectClip(clip);
                });

                // Funcionalidad de Trimming (Recorte de bordes)
                setupTrim(leftHandle, clip, 'left');
                setupTrim(rightHandle, clip, 'right');

                track.appendChild(clipEl);

                if (clip.start + clip.duration > maxTime) maxTime = clip.start + clip.duration;
            });

            document.getElementById('total-duration').textContent = `Tiempo Máx: ${maxTime.toFixed(1)}s`;
        }

        // --- LOGICA DE TRIMMING (RECORTAR CLIPS) ---
        function setupTrim(handle, clip, side) {
            handle.addEventListener('mousedown', function(e) {
                e.stopPropagation();
                const startX = e.clientX;
                const originalStart = clip.start;
                const originalDuration = clip.duration;
                const originalTrimLeft = clip.trimLeft;

                function onMouseMove(moveEvent) {
                    const deltaX = moveEvent.clientX - startX;
                    const deltaTime = deltaX / PIXELS_PER_SECOND;

                    if (side === 'left') {
                        if (originalDuration - deltaTime > 0.5) {
                            clip.start = originalStart + deltaTime;
                            clip.duration = originalDuration - deltaTime;
                            clip.trimLeft = originalTrimLeft + deltaTime;
                        }
                    } else {
                        if (originalDuration + deltaTime > 0.5) {
                            clip.duration = originalDuration + deltaTime;
                        }
                    }
                    renderTimelineUI();
                    updateMonitor();
                }

                function onMouseUp() {
                    window.removeEventListener('mousemove', onMouseMove);
                    window.removeEventListener('mouseup', onMouseUp);
                }

                window.addEventListener('mousemove', onMouseMove);
                window.addEventListener('mouseup', onMouseUp);
            });
        }

        // --- INSPECTOR DE PROPIEDADES DINÁMICO ---
        function selectClip(clip) {
            selectedClip = clip;
            renderTimelineUI();

            const inspector = document.getElementById('inspector');
            inspector.innerHTML = `
                <h2 style="font-size: 1rem; color: #fff;">Propiedades del Clip</h2>
                <p style="font-size:0.75rem; color: var(--text-dim)">${clip.name}</p>
                <hr style="border: 1px solid var(--panel-border)">
                
                <div class="inspector-group">
                    <h3>Transformación</h3>
                    <div class="control-row">
                        <label>Escala (%)</label>
                        <input type="range" min="10" max="300" value="${clip.scale}" oninput="updateProp('scale', this.value)">
                    </div>
                    <div class="control-row">
                        <label>Posición X</label>
                        <input type="number" value="${clip.posX}" onchange="updateProp('posX', parseInt(this.value))">
                    </div>
                    <div class="control-row">
                        <label>Posición Y</label>
                        <input type="number" value="${clip.posY}" onchange="updateProp('posY', parseInt(this.value))">
                    </div>
                </div>

                <div class="inspector-group">
                    <h3>Efectos Visuales</h3>
                    <div class="control-row">
                        <label>Opacidad</label>
                        <input type="range" min="0" max="1" step="0.1" value="${clip.opacity}" oninput="updateProp('opacity', this.value)">
                    </div>
                    <div class="control-row">
                        <label>Filtro FX</label>
                        <select onchange="updateProp('filter', this.value)" style="background:#222; color:#fff; border:1px solid #444; padding:3px;">
                            <option value="none" ${clip.filter === 'none' ? 'selected' : ''}>Ninguno</option>
                            <option value="grayscale(100%)" ${clip.filter.includes('grayscale') ? 'selected' : ''}>Blanco y Negro</option>
                            <option value="sepia(80%)" ${clip.filter.includes('sepia') ? 'selected' : ''}>Nostalgia Sepia</option>
                            <option value="hue-rotate(90deg)" ${clip.filter.includes('hue-rotate') ? 'selected' : ''}>Psicodélico</option>
                            <option value="invert(100%)" ${clip.filter.includes('invert') ? 'selected' : ''}>Invertido</option>
                            <option value="blur(5px)" ${clip.filter.includes('blur') ? 'selected' : ''}>Desenfoque</option>
                        </select>
                    </div>
                </div>

                ${clip.type === 'audio' || clip.type === 'video' ? `
                <div class="inspector-group">
                    <h3>Audio</h3>
                    <div class="control-row">
                        <label>Volumen</label>
                        <input type="range" min="0" max="1" step="0.1" value="${clip.volume}" oninput="updateProp('volume', this.value)">
                    </div>
                </div>
                ` : ''}
                
                <button class="btn" style="background:#cc3333; width:100%; border:none; margin-top:10px;" onclick="deleteSelectedClip()">Eliminar Clip</button>
            `;
        }

        function updateProp(property, value) {
            if (selectedClip) {
                selectedClip[property] = value;
                updateMonitor();
            }
        }

        function deleteSelectedClip() {
            if (!selectedClip) return;
            // Si es un audio o video track, asegurar apagar su sonido antes de borrar
            if (selectedClip.type === 'video' || selectedClip.type === 'audio') {
                const asset = assets[selectedClip.assetId];
                if(asset) asset.element.pause();
            }
            timelineClips = timelineClips.filter(c => c.id !== selectedClip.id);
            selectedClip = null;
            document.getElementById('inspector').innerHTML = '<p style="color: var(--text-dim); text-align: center; margin-top: 20px;">Selecciona un clip para editar sus propiedades</p>';
            renderTimelineUI();
            updateMonitor();
        }

        // --- NÚCLEO DE PROCESAMIENTO GRÁFICO (MONITOR ENGINE) ---
        function clearMonitor() {
            ctx.fillStyle = '#050507';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            // Cuadrícula técnica de fondo de video profesional
            ctx.strokeStyle = '#111116';
            ctx.lineWidth = 2;
            for(let i=0; i<canvas.width; i+=80) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke(); }
            for(let j=0; j<canvas.height; j+=45) { ctx.beginPath(); ctx.moveTo(0, j); ctx.lineTo(canvas.width, j); ctx.stroke(); }
        }

        function updateMonitor() {
            clearMonitor();

            // Orden de Capas Crítico para Composición (Abajo hacia Arriba): Audio -> Video -> Imagen/Gráfico
            const renderOrder = ['video', 'image'];

            renderOrder.forEach(layerType => {
                const activeClipsInLayer = timelineClips.filter(c => c.type === layerType && currentTime >= c.start && currentTime <= (c.start + c.duration));
                
                activeClipsInLayer.forEach(clip => {
                    const asset = assets[clip.assetId];
                    if (!asset) return;

                    ctx.save();
                    
                    // Aplicar propiedades de transformación
                    ctx.globalAlpha = parseFloat(clip.opacity);
                    ctx.filter = clip.filter;

                    // Centrado inicial de composición
                    let targetW = canvas.width;
                    let targetH = canvas.height;

                    if (clip.type === 'image') {
                        // Mantener ratio de imagen por defecto
                        const ratio = asset.element.width / asset.element.height;
                        targetH = canvas.height * 0.5; 
                        targetW = targetH * ratio;
                    }

                    // Escalado por propiedades del inspector
                    targetW *= (clip.scale / 100);
                    targetH *= (clip.scale / 100);

                    const xPos = (canvas.width - targetW) / 2 + parseInt(clip.posX);
                    const yPos = (canvas.height - targetH) / 2 + parseInt(clip.posY);

                    if (clip.type === 'video') {
                        const vElement = asset.element;
                        // Sincronizar el puntero del video con el puntero global del timeline
                        const internalVideoTime = (currentTime - clip.start) + clip.trimLeft;
                        
                        if (Math.abs(vElement.currentTime - internalVideoTime) > 0.1) {
                            vElement.currentTime = internalVideoTime;
                        }
                        
                        ctx.drawImage(vElement, xPos, yPos, targetW, targetH);
                    } else if (clip.type === 'image') {
                        ctx.drawImage(asset.element, xPos, yPos, targetW, targetH);
                    }

                    ctx.restore();
                });
            });

            // Manejo paralelo independiente de la Capa de Audio de fondo
            timelineClips.filter(c => c.type === 'audio' || c.type === 'video').forEach(clip => {
                const asset = assets[clip.assetId];
                if (!asset) return;
                
                const element = asset.element;
                const isInsideTimeline = currentTime >= clip.start && currentTime <= (clip.start + clip.duration);

                if (isInsideTimeline && isPlaying) {
                    element.volume = clip.volume;
                    const internalTime = (currentTime - clip.start) + clip.trimLeft;
                    if (Math.abs(element.currentTime - internalTime) > 0.15) {
                        element.currentTime = internalTime;
                    }
                    if (element.paused) element.play().catch(()=>{});
                } else {
                    if (!element.paused) element.pause();
                }
            });
        }

        // --- MOTOR DE REPRODUCCIÓN (PLAYBACK CONTEXT) ---
        function playbackLoop() {
            if (!isPlaying) return;

            currentTime += 1 / 30; // Simulando refresco regular de 30 FPS estándar
            
            // Mover visualmente el playhead
            const playheadLeft = 100 + (currentTime * PIXELS_PER_SECOND);
            document.getElementById('global-playhead').style.left = `${playheadLeft}px`;

            // Actualizar reloj de código de tiempo
            const mins = Math.floor(currentTime / 60).toString().padStart(2, '0');
            const secs = Math.floor(currentTime % 60).toString().padStart(2, '0');
            const ms = Math.floor((currentTime % 1) * 100).toString().padStart(2, '0');
            document.getElementById('timecode').textContent = `${mins}:${secs}.${ms}`;

            updateMonitor();
            animationFrameId = requestAnimationFrame(playbackLoop);
        }

        function togglePlayback() {
            const btn = document.getElementById('btn-play');
            if (isPlaying) {
                isPlaying = false;
                btn.textContent = 'Reproducir';
                if (animationFrameId) cancelAnimationFrame(animationFrameId);
                
                // Pausar todos los emisores de hardware de audio
                timelineClips.forEach(c => {
                    const asset = assets[c.assetId];
                    if (asset && (c.type === 'video' || c.type === 'audio')) asset.element.pause();
                });
            } else {
                isPlaying = true;
                btn.textContent = 'Pausar';
                playbackLoop();
            }
        }

        function movePlayheadViaTimeline(e) {
            // Evitar detonar si hace click en un clip directamente
            if(e.target.classList.contains('timeline-clip') || e.target.closest('.timeline-clip')) return;
            
            const rect = document.getElementById('timeline-container').getBoundingClientRect();
            const clickX = e.clientX - rect.left - 100; // Ajuste por la barra de control fija
            if (clickX < 0) return;

            currentTime = clickX / PIXELS_PER_SECOND;
            document.getElementById('global-playhead').style.left = `${clickX + 100}px`;
            
            updateMonitor();
        }

        function exportTimeline() {
            alert("🛠️ COMPILADOR DE RENDER\n\nTu línea de tiempo estructurada con capas complejas y efectos gráficos está lista. En un software completo de distribución de escritorio, este botón inicializaría un pipeline a través de 'FFmpeg.wasm' o capturaría los buffers con 'MediaRecorder' para exportar tu archivo final comprimido en H.264 MP4.");
        }
    </script>

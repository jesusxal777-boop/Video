<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DreamForge Studio OS - Ultimate NLE</title>
    <style>
        :root {
            --bg-dark: #0a0a0c;
            --panel-bg: #121216;
            --panel-border: #22222a;
            --accent: #007acc;
            --accent-hover: #0098ff;
            --text: #e1e1e6;
            --text-dim: #797986;
            --timeline-bg: #0d0d10;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; user-select: none; }
        body { background-color: var(--bg-dark); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        header {
            background-color: var(--panel-bg);
            border-bottom: 2px solid var(--panel-border);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 { font-size: 1rem; letter-spacing: 1px; color: var(--text); font-weight: 700; }

        .btn {
            background: linear-gradient(180deg, #25252b 0%, #16161c 100%);
            border: 1px solid var(--panel-border);
            color: var(--text);
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            transition: all 0.15s;
        }
        .btn:hover { border-color: var(--accent); background: #1c1c24; }
        .btn-active { background: linear-gradient(180deg, var(--accent-hover) 0%, var(--accent) 100%); border-color: #005999; }
        .btn-danger { background: #5a1818; border-color: #7a2222; }
        .btn-danger:hover { background: #7a2222; border-color: #9a2c2c; }

        .workspace {
            flex: 1;
            display: grid;
            grid-template-columns: 280px 1fr 280px;
            grid-template-rows: 1fr 280px;
            height: calc(100vh - 54px);
        }

        /* Panel Izquierdo */
        .panel-left {
            background-color: var(--panel-bg);
            border-right: 2px solid var(--panel-border);
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            grid-row: 1;
        }

        .upload-zone {
            border: 2px dashed var(--panel-border);
            border-radius: 6px;
            padding: 20px;
            text-align: center;
            color: var(--text-dim);
            cursor: pointer;
            font-size: 0.8rem;
        }
        .upload-zone:hover { border-color: var(--accent); color: var(--text); }

        .asset-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
        .asset-item {
            background-color: #181820;
            border: 1px solid var(--panel-border);
            padding: 10px;
            border-radius: 4px;
            cursor: grab;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Monitor */
        .panel-center {
            grid-column: 2;
            background-color: #060608;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .monitor-wrapper {
            width: 100%;
            max-width: 640px;
            aspect-ratio: 16 / 9;
            background-color: #000;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #1c1c24;
        }
        canvas { width: 100%; height: 100%; display: block; }

        .controls { margin-top: 15px; display: flex; gap: 12px; align-items: center; }
        #timecode { font-family: monospace; font-size: 1.1rem; color: #00ffaa; text-shadow: 0 0 10px rgba(0,255,170,0.2); }

        /* Inspector */
        .panel-right {
            background-color: var(--panel-bg);
            border-left: 2px solid var(--panel-border);
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            font-size: 0.8rem;
            overflow-y: auto;
        }
        .inspector-group {
            border-bottom: 1px solid var(--panel-border);
            padding-bottom: 12px;
        }
        .inspector-group h3 { font-size: 0.75rem; margin-bottom: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }
        .control-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .control-row input[type="range"] { width: 110px; }
        .control-row input[type="number"], .control-row select { background: #0d0d10; border: 1px solid #2d2d3a; color: #fff; padding: 4px; border-radius: 4px; }
        .control-row input[type="number"] { width: 55px; }

        /* Timeline */
        .panel-timeline {
            grid-column: 1 / span 3;
            grid-row: 2;
            background-color: var(--panel-bg);
            border-top: 2px solid var(--panel-border);
            display: flex;
            flex-direction: column;
        }

        .timeline-toolbar {
            background-color: #09090c;
            padding: 8px 20px;
            border-bottom: 1px solid var(--panel-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
        }

        .timeline-container {
            flex: 1;
            overflow-x: auto;
            overflow-y: hidden;
            position: relative;
            background-color: var(--timeline-bg);
            padding: 10px 0;
        }

        .tracks-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-left: 120px;
            min-width: 3000px;
        }

        .track-label {
            position: absolute;
            left: 0;
            width: 110px;
            height: 48px;
            background-color: #16161c;
            border: 1px solid var(--panel-border);
            display: flex;
            align-items: center;
            padding-left: 10px;
            font-size: 0.7rem;
            font-weight: 700;
            z-index: 5;
            border-radius: 0 4px 4px 0;
        }

        .timeline-track {
            height: 48px;
            background-color: #0e0e12;
            border: 1px solid #1a1a22;
            position: relative;
            width: 100%;
            border-radius: 4px;
        }

        .timeline-clip {
            position: absolute;
            top: 2px;
            height: 42px;
            background: linear-gradient(135deg, #1d3557 0%, #101f35 100%);
            border: 1px solid #31588c;
            border-radius: 4px;
            color: white;
            padding: 4px 8px;
            font-size: 0.7rem;
            cursor: pointer;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .timeline-clip.selected { border-color: #ffaa00; box-shadow: 0 0 10px rgba(255, 170, 0, 0.4); }
        
        .trim-handle {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 5px;
            background-color: rgba(255,255,255,0.2);
            cursor: ew-resize;
        }
        .trim-left { left: 0; }
        .trim-right { right: 0; }
        .trim-handle:hover { background-color: var(--accent); }

        /* Aguja */
        .playhead {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 2px;
            background-color: #ff3344;
            left: 120px;
            pointer-events: none;
            z-index: 10;
        }
        .playhead::before {
            content: ''; position: absolute; top: 0; left: -5px;
            border-left: 6px solid transparent; border-right: 6px solid transparent;
            border-top: 8px solid #ff3344;
        }
    </style>
</head>
<body>

    <header>
        <h1>DREAMFORGE ENGINE PRO NLE</h1>
        <button class="btn btn-active" onclick="exportRealVideo()">Exportar Video Real</button>
    </header>

    <div class="workspace">
        <div class="panel-left">
            <div class="upload-zone" onclick="document.getElementById('file-loader').click()">
                <p>+ Cargar Archivos</p>
                <span style="font-size: 0.65rem; color: var(--text-dim)">Videos, Audio o Fotos</span>
            </div>
            <input type="file" id="file-loader" accept="video/*,image/*,audio/*" multiple style="display:none">
            <div class="asset-list" id="asset-list"></div>
        </div>

        <div class="panel-center">
            <div class="monitor-wrapper">
                <canvas id="main-monitor"></canvas>
            </div>
            <div class="controls">
                <button class="btn" onclick="splitClip()" title="Corta el clip seleccionado en la aguja de tiempo (Tecla S)">✂️ Cortar (S)</button>
                <button class="btn btn-active" id="btn-play" onclick="togglePlayback()">Reproducir</button>
                <div id="timecode">00:00.00</div>
            </div>
        </div>

        <div class="panel-right" id="inspector">
            <p style="color: var(--text-dim); text-align: center; margin-top: 20px;">Selecciona un clip para ajustar transformaciones, cortes, fundidos o paneos.</p>
        </div>
    </div>

    <div class="panel-timeline">
        <div class="timeline-toolbar">
            <div>Líneas de Tiempo Multicapa (Presiona 'S' para cortar clip seleccionado)</div>
            <div id="total-duration" style="font-family: monospace;">Total: 0.0s</div>
        </div>
        <div class="timeline-container" id="timeline-container" onclick="movePlayhead(event)">
            <div class="playhead" id="global-playhead"></div>
            
            <div class="tracks-wrapper">
                <div class="track-label" style="top: 0;">🎞️ Video Principal</div>
                <div class="timeline-track" id="track-video" data-type="video" style="margin-top: 0;"></div>

                <div class="track-label" style="top: 54px;">🖼️ Superposición</div>
                <div class="timeline-track" id="track-image" data-type="image"></div>

                <div class="track-label" style="top: 108px;">🎵 Pista de Audio</div>
                <div class="timeline-track" id="track-audio" data-type="audio"></div>
            </div>
        </div>
    </div>

    <script>
        // --- DATA & STATE MANAGEMENT ---
        let assets = {};
        let timelineClips = [];
        let selectedClip = null;
        let currentTime = 0; 
        let isPlaying = false;
        let animationFrameId = null;
        const PIXELS_PER_SECOND = 25; 

        const canvas = document.getElementById('main-monitor');
        const ctx = canvas.getContext('2d');
        canvas.width = 1280;
        canvas.height = 720;

        clearMonitor();

        // Escuchar teclado global para atajos de edición rápido
        window.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === 's') splitClip();
        });

        // --- IMPORTACIÓN DE ARCHIVOS ---
        document.getElementById('file-loader').addEventListener('change', function(e) {
            Array.from(e.target.files).forEach(file => {
                const id = 'asset-' + Date.now() + Math.random().toString(36).substr(2, 4);
                const url = URL.createObjectURL(file);
                let type = 'image';

                if (file.type.startsWith('video')) type = 'video';
                if (file.type.startsWith('audio')) type = 'audio';

                let element;
                if (type === 'video') {
                    element = document.createElement('video');
                    element.src = url;
                    element.muted = true;
                    element.load();
                } else if (type === 'audio') {
                    element = document.createElement('audio');
                    element.src = url;
                } else {
                    element = new Image();
                    element.src = url;
                }

                assets[id] = { id, name: file.name, type, element };

                const item = document.createElement('div');
                item.className = 'asset-item';
                item.draggable = true;
                item.innerHTML = `<span>${type === 'video' ? '🎥' : type === 'audio' ? '🎵' : '🖼️'} ${file.name}</span>`;
                item.addEventListener('dragstart', (ev) => {
                    ev.dataTransfer.setData('text/asset-id', id);
                });
                document.getElementById('asset-list').appendChild(item);
            });
        });

        // --- DRAG AND DROP ---
        document.querySelectorAll('.timeline-track').forEach(track => {
            track.addEventListener('dragover', e => e.preventDefault());
            track.addEventListener('drop', function(e) {
                e.preventDefault();
                const assetId = e.dataTransfer.getData('text/asset-id');
                const asset = assets[assetId];
                if (!asset || track.dataset.type !== asset.type) return;

                const rect = track.getBoundingClientRect();
                const clickX = e.clientX - rect.left;
                const startTime = clickX / PIXELS_PER_SECOND;

                let duration = 5; 
                if (asset.type === 'video' || asset.type === 'audio') {
                    duration = asset.element.duration || 5;
                }

                const newClip = {
                    id: 'clip-' + Date.now(),
                    assetId: assetId,
                    type: asset.type,
                    name: asset.name,
                    start: startTime,
                    duration: duration,
                    trimLeft: 0,
                    opacity: 1,
                    scale: 100,
                    posX: 0,
                    posY: 0,
                    filter: 'none',
                    volume: 1,
                    // NUEVOS CONTROLES CINEMÁTICOS (Fades y Paneo)
                    fadeIn: 0,       // Duración del fundido de entrada en segundos
                    fadeOut: 0,      // Duración del fundido de salida en segundos
                    panSpeedX: 0,    // Velocidad de paneo horizontal continuo
                    panSpeedY: 0     // Velocidad de paneo vertical continuo
                };

                timelineClips.push(newClip);
                renderTimelineUI();
                updateMonitor();
            });
        });

        // --- RENDER TIMELINE ---
        function renderTimelineUI() {
            document.querySelectorAll('.timeline-track').forEach(t => t.innerHTML = '');
            let maxTime = 0;

            timelineClips.forEach(clip => {
                const track = document.getElementById(`track-${clip.type}`);
                if (!track) return;

                const clipEl = document.createElement('div');
                clipEl.className = `timeline-clip ${selectedClip && selectedClip.id === clip.id ? 'selected' : ''}`;
                clipEl.style.left = `${clip.start * PIXELS_PER_SECOND}px`;
                clipEl.style.width = `${clip.duration * PIXELS_PER_SECOND}px`;
                clipEl.innerHTML = `<strong style="white-space:nowrap;text-overflow:ellipsis;overflow:hidden;">${clip.name}</strong>`;

                const leftHandle = document.createElement('div');
                leftHandle.className = 'trim-handle trim-left';
                const rightHandle = document.createElement('div');
                rightHandle.className = 'trim-handle trim-right';

                clipEl.appendChild(leftHandle);
                clipEl.appendChild(rightHandle);

                clipEl.addEventListener('click', (e) => { e.stopPropagation(); selectClip(clip); });

                setupTrim(leftHandle, clip, 'left');
                setupTrim(rightHandle, clip, 'right');

                track.appendChild(clipEl);
                if (clip.start + clip.duration > maxTime) maxTime = clip.start + clip.duration;
            });

            document.getElementById('total-duration').textContent = `Total: ${maxTime.toFixed(1)}s`;
        }

        function setupTrim(handle, clip, side) {
            handle.addEventListener('mousedown', function(e) {
                e.stopPropagation();
                const startX = e.clientX;
                const originalStart = clip.start;
                const originalDuration = clip.duration;
                const originalTrimLeft = clip.trimLeft;

                function onMouseMove(ev) {
                    const deltaX = ev.clientX - startX;
                    const deltaTime = deltaX / PIXELS_PER_SECOND;

                    if (side === 'left') {
                        if (originalDuration - deltaTime > 0.3) {
                            clip.start = originalStart + deltaTime;
                            clip.duration = originalDuration - deltaTime;
                            clip.trimLeft = originalTrimLeft + deltaTime;
                        }
                    } else {
                        if (originalDuration + deltaTime > 0.3) {
                            clip.duration = originalDuration + deltaTime;
                        }
                    }
                    renderTimelineUI();
                    updateMonitor();
                }

                function onMouseUp() {
                    window.removeEventListener('mousemove', onMouseMove);
                    window.removeEventListener('mouseup', onMouseUp);
                }
                window.addEventListener('mousemove', onMouseMove);
                window.addEventListener('mouseup', onMouseUp);
            });
        }

        // --- HERRAMIENTA DE RECORTE / CORTE (SPLIT) ---
        function splitClip() {
            if (!selectedClip) return alert("Selecciona un clip en la línea de tiempo primero.");
            
            // Validar que la aguja esté realmente encima del clip seleccionado
            if (currentTime <= selectedClip.start || currentTime >= (selectedClip.start + selectedClip.duration)) {
                return alert("Coloca la aguja roja encima del clip seleccionado para cortarlo.");
            }

            const timeOffset = currentTime - selectedClip.start;

            // Clonar propiedades para la segunda mitad
            const splitPartTwo = {
                ...selectedClip,
                id: 'clip-' + Date.now() + '-split',
                start: currentTime,
                duration: selectedClip.duration - timeOffset,
                trimLeft: selectedClip.trimLeft + timeOffset
            };

            // Acortar la primera mitad original
            selectedClip.duration = timeOffset;

            // Insertar en el arreglo global
            timelineClips.push(splitPartTwo);
            selectedClip = splitPartTwo; // Seleccionar automáticamente la parte cortada derecha

            renderTimelineUI();
            selectClip(selectedClip);
            updateMonitor();
        }

        // --- INSPECTOR DE PROPIEDADES AVANZADO ---
        function selectClip(clip) {
            selectedClip = clip;
            renderTimelineUI();

            const inspector = document.getElementById('inspector');
            inspector.innerHTML = `
                <h3 style="color: #fff;">Inspector Cinematográfico</h3>
                <hr style="border-color: var(--panel-border); margin: 8px 0;">
                
                <div class="inspector-group">
                    <h3>Transformación Base</h3>
                    <div class="control-row">
                        <label>Escala %</label>
                        <input type="range" min="10" max="250" value="${clip.scale}" oninput="updateProp('scale', parseFloat(this.value))">
                    </div>
                    <div class="control-row">
                        <label>Posición X</label>
                        <input type="number" value="${clip.posX}" onchange="updateProp('posX', parseInt(this.value))">
                    </div>
                    <div class="control-row">
                        <label>Posición Y</label>
                        <input type="number" value="${clip.posY}" onchange="updateProp('posY', parseInt(this.value))">
                    </div>
                </div>

                <div class="inspector-group">
                    <h3>Transiciones / Fundidos (Fades)</h3>
                    <div class="control-row">
                        <label>Fade In (s)</label>
                        <input type="number" min="0" max="5" step="0.1" value="${clip.fadeIn}" onchange="updateProp('fadeIn', parseFloat(this.value))">
                    </div>
                    <div class="control-row">
                        <label>Fade Out (s)</label>
                        <input type="number" min="0" max="5" step="0.1" value="${clip.fadeOut}" onchange="updateProp('fadeOut', parseFloat(this.value))">
                    </div>
                </div>

                <div class="inspector-group">
                    <h3>Paneo Dinámico (Movimiento)</h3>
                    <div class="control-row">
                        <label>Velocidad X</label>
                        <input type="range" min="-10" max="10" step="1" value="${clip.panSpeedX}" oninput="updateProp('panSpeedX', parseInt(this.value))">
                    </div>
                    <div class="control-row">
                        <label>Velocidad Y</label>
                        <input type="range" min="-10" max="10" step="1" value="${clip.panSpeedY}" oninput="updateProp('panSpeedY', parseInt(this.value))">
                    </div>
                </div>

                <div class="inspector-group">
                    <h3>Efectos y Estilos</h3>
                    <div class="control-row">
                        <label>Filtro FX</label>
                        <select onchange="updateProp('filter', this.value)">
                            <option value="none" ${clip.filter==='none'?'selected':''}>Sin Filtro</option>
                            <option value="grayscale(100%)" ${clip.filter.includes('grayscale')?'selected':''}>B&N</option>
                            <option value="sepia(100%)" ${clip.filter.includes('sepia')?'selected':''}>Sepia Cine</option>
                            <option value="invert(100%)" ${clip.filter.includes('invert')?'selected':''}>Invertido</option>
                            <option value="blur(4px)" ${clip.filter.includes('blur')?'selected':''}>Desenfoque</option>
                        </select>
                    </div>
                    <div class="control-row">
                        <label>Opacidad Máx</label>
                        <input type="range" min="0" max="1" step="0.1" value="${clip.opacity}" oninput="updateProp('opacity', parseFloat(this.value))">
                    </div>
                </div>

                <button class="btn btn-danger" style="width:100%; margin-top:5px; border:none;" onclick="deleteClip()">Borrar Elemento</button>
            `;
        }

        function updateProp(prop, val) {
            if (selectedClip) { selectedClip[prop] = val; updateMonitor(); }
        }

        function deleteClip() {
            if (!selectedClip) return;
            timelineClips = timelineClips.filter(c => c.id !== selectedClip.id);
            selectedClip = null;
            document.getElementById('inspector').innerHTML = '<p style="color: var(--text-dim); text-align: center; margin-top: 20px;">Selecciona un clip para ajustar transformaciones, cortes, fundidos o paneos.</p>';
            renderTimelineUI();
            updateMonitor();
        }

        // --- ENGINE GRÁFICO CON SOPORTE DE KEYFRAMES DINÁMICOS ---
        function clearMonitor() {
            ctx.fillStyle = '#050507';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function updateMonitor() {
            clearMonitor();
            const order = ['video', 'image']; 

            order.forEach(layer => {
                timelineClips.filter(c => c.type === layer && currentTime >= c.start && currentTime <= (c.start + c.duration)).forEach(clip => {
                    const asset = assets[clip.assetId];
                    if (!asset) return;

                    ctx.save();
                    
                    // --- CÁLCULO DE INTERPOLACIÓN PARA LOS FUNDIDOS (FADES) ---
                    let targetOpacity = clip.opacity;
                    const timeInClip = currentTime - clip.start; // Cuántos segundos lleva reproduciéndose el clip
                    const timeRemaining = (clip.start + clip.duration) - currentTime; // Cuánto le falta para terminar

                    if (clip.fadeIn > 0 && timeInClip < clip.fadeIn) {
                        targetOpacity *= (timeInClip / clip.fadeIn); // Interpolación lineal ascendente
                    } else if (clip.fadeOut > 0 && timeRemaining < clip.fadeOut) {
                        targetOpacity *= (timeRemaining / clip.fadeOut); // Interpolación lineal descendente
                    }

                    ctx.globalAlpha = targetOpacity;
                    ctx.filter = clip.filter;

                    // --- CÁLCULO DE PANEO DINÁMICO (MOVIMIENTO DE CÁMARA CONTINUO) ---
                    let currentPanX = clip.posX + (timeInClip * clip.panSpeedX * 15);
                    let currentPanY = clip.posY + (timeInClip * clip.panSpeedY * 15);

                    let w = canvas.width * (clip.scale / 100);
                    let h = canvas.height * (clip.scale / 100);
                    let x = (canvas.width - w) / 2 + currentPanX;
                    let y = (canvas.height - h) / 2 + currentPanY;

                    if (clip.type === 'video') {
                        const v = asset.element;
                        const vTime = (currentTime - clip.start) + clip.trimLeft;
                        if (Math.abs(v.currentTime - vTime) > 0.15) v.currentTime = vTime;
                        ctx.drawImage(v, x, y, w, h);
                    } else {
                        ctx.drawImage(asset.element, x, y, w, h);
                    }
                    ctx.restore();
                });
            });

            // Sincronizador de Audio de fondo
            timelineClips.filter(c => c.type === 'audio' || c.type === 'video').forEach(clip => {
                const asset = assets[clip.assetId];
                if (!asset) return;
                const el = asset.element;
                const active = currentTime >= clip.start && currentTime <= (clip.start + clip.duration);

                if (active && isPlaying) {
                    el.volume = clip.volume;
                    const internalTime = (currentTime - clip.start) + clip.trimLeft;
                    if (Math.abs(el.currentTime - internalTime) > 0.15) el.currentTime = internalTime;
                    if (el.paused) el.play().catch(()=>{});
                } else {
                    el.pause();
                }
            });
        }

        // --- PLAYBACK ENGINE ---
        function playbackLoop() {
            if (!isPlaying) return;
            currentTime += 1 / 30; 

            const playheadLeft = 120 + (currentTime * PIXELS_PER_SECOND);
            document.getElementById('global-playhead').style.left = `${playheadLeft}px`;

            const mins = Math.floor(currentTime / 60).toString().padStart(2, '0');
            const secs = Math.floor(currentTime % 60).toString().padStart(2, '0');
            const ms = Math.floor((currentTime % 1) * 100).toString().padStart(2, '0');
            document.getElementById('timecode').textContent = `${mins}:${secs}.${ms}`;

            updateMonitor();
            animationFrameId = requestAnimationFrame(playbackLoop);
        }

        function togglePlayback() {
            const btn = document.getElementById('btn-play');
            if (isPlaying) {
                isPlaying = false;
                btn.textContent = 'Reproducir';
                if (animationFrameId) cancelAnimationFrame(animationFrameId);
                timelineClips.forEach(c => { const a = assets[c.assetId]; if (a && a.element.pause) a.element.pause(); });
            } else {
                isPlaying = true;
                btn.textContent = 'Pausar';
                playbackLoop();
            }
        }

        function movePlayhead(e) {
            if (e.target.classList.contains('timeline-clip') || e.target.closest('.timeline-clip')) return;
            const rect = document.getElementById('timeline-container').getBoundingClientRect();
            const clickX = e.clientX - rect.left - 120;
            if (clickX < 0) return;

            currentTime = clickX / PIXELS_PER_SECOND;
            document.getElementById('global-playhead').style.left = `${clickX + 120}px`;
            updateMonitor();
        }

        // --- EXPORTACIÓN DEFINITIVA A VIDEO WEBMA/MP4 ---
        function exportRealVideo() {
            if (timelineClips.length === 0) return alert("Añade algún clip antes de compilar.");
            
            alert("Iniciando Renderizador de Hardware por GPU...\nEl sistema procesará cuadro por cuadro todos los fundidos, cortes y paneos directamente a un archivo de video final.");

            if (isPlaying) togglePlayback();
            currentTime = 0;
            updateMonitor();

            // Captura el stream de video crudo generado por el Canvas a 30 FPS fijos
            const stream = canvas.captureStream(30);
            
            // Usamos VP9/VP8 que es el estándar universal compatible con MediaRecorder sin servidores externos
            const recorder = new MediaRecorder(stream, {
                mimeType: 'video/webm;codecs=vp9',
                videoBitsPerSecond: 6000000 // 6 Mbps (Calidad HD limpia)
            });

            const chunks = [];
            recorder.ondataavailable = e => { if (e.data && e.data.size > 0) chunks.push(e.data); };

            recorder.onstop = () => {
                const blob = new Blob(chunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                
                const a = document.createElement('a');
                a.href = url;
                a.download = `DreamForge_Master_Render_${Date.now()}.webm`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                
                alert("¡Exportación finalizada con éxito! Video descargado.");
                currentTime = 0;
                updateMonitor();
            };

            let totalDuration = 0;
            timelineClips.forEach(c => { if (c.start + c.duration > totalDuration) totalDuration = c.start + c.duration; });

            recorder.start();
            isPlaying = true;

            // Ciclo síncrono ultra-rápido de renderizado dedicado para grabación
            const renderInterval = setInterval(() => {
                currentTime += 1 / 30;
                updateMonitor();

                if (currentTime >= totalDuration) {
                    clearInterval(renderInterval);
                    isPlaying = false;
                    recorder.stop();
                    timelineClips.forEach(c => { const a = assets[c.assetId]; if (a && a.element.pause) a.element.pause(); });
                }
            }, 1000 / 30);
        }
    </script>
